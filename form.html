<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Don't forget form will not work locally -->
    <form action="formhandler.php" method="post">
        <fieldset>
            <label for="name">Name</label>
            <input type="text" name="name">
            <label for="email">Email</label>
            <input type="email" name="name">

            <label for="">Gender</label>
            <ul>
                <li>
                    <input type="radio" name="gender" value="female"> Female
                </li>
                <li>
                    <input type="radio" name="gender" value="male"> Male
                </li>
                <li>
                    <input type="radio" name="gender" value="other"> Other
                </li>
            </ul>

            <label for="">Favorite Wines</label>
            <ul>
                <li>
                    <input type="checkbox" name="wines[]" value="cab"> Cabernet
                </li>
                <li>
                    <input type="checkbox" name="wines[]" value="merlot"> Merlot
                </li>
                <li>
                    <input type="checkbox" name="wines[]" value="malbec"> Malbec
                </li>
                <li>
                    <input type="checkbox" name="wines[]" value="syrah"> Syrah
                </li>
            </ul>
            <label for="">Regions</label>
            <select name="regions" id="">
                <option value="">select one</option>
                <option value="nw">Northwest</option>
                <option value="sw">South West</option>
                <option value="mw">Midwest</option>
                <option value="ne">Northeast</option>
                <option value="so">South</option>
            </select>
            <label for="">Comments</label>
            <textarea name="comments" id=""></textarea>
            <input type="submit" name="submit" value="Sent it">
        </fieldset>
    </form>
</body>

</html>
